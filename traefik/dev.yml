# Dev-only routing: file provider instead of the Docker provider, since Traefik's Docker provider can't reach
# this machine's Docker Desktop daemon (see private/PLAN.md, "Gaps conocidos"). Mirrors production's single
# origin (api under /api, everything else to web) so the browser never needs CORS between the two dev servers.
http:
  routers:
    api:
      rule: "PathPrefix(`/api`)"
      entryPoints: [web]
      service: api
      priority: 10
    web:
      rule: "PathPrefix(`/`)"
      entryPoints: [web]
      service: web
      priority: 1
  services:
    api:
      loadBalancer:
        servers:
          - url: "http://api:3000"
    web:
      loadBalancer:
        servers:
          - url: "http://web:4321"
