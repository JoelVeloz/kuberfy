services:
  traefik:
    image: traefik:v3.7
    command:
      # kuberfy itself stays a plain container in dev (see the `kuberfy:` service below), so the docker provider
      # is what makes it visible to Traefik here. Deployed apps, on the other hand, are Swarm services even in
      # dev (services/deploy.ts) — the swarm provider is what makes *those* visible. Production (install.sh) only
      # needs the swarm provider, since kuberfy runs as a Swarm service there too.
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.swarm=true
      - --providers.swarm.exposedbydefault=false
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.fields.headers.names.User-Agent=keep
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:-admin@example.com}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    networks:
      - kuberfy-network
      - kuberfy-apps-network
    mem_limit: 256m
    restart: unless-stopped

  kuberfy:
    build: .
    environment:
      - DATABASE_PATH=/data/kuberfy.db
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - KUBERFY_DOMAIN=${KUBERFY_DOMAIN:-localhost}
    volumes:
      - kuberfy-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only view of the host's real /proc — lets the Processes table see every host process even though
      # Swarm services can't share the host PID namespace (production has no --pid=host equivalent).
      - /proc:/host/proc:ro
    mem_limit: 256m
    labels:
      - traefik.enable=true
      - traefik.http.routers.kuberfy.rule=Host(`${KUBERFY_DOMAIN:-localhost}`)
      - traefik.http.routers.kuberfy.entrypoints=web
      - traefik.http.services.kuberfy.loadbalancer.server.port=3000
    networks:
      - kuberfy-network
    # Docker Desktop's docker.sock doesn't expose a stable, matchable GID like a real Linux host does, so local dev
    # keeps this container on root. The production installer (install.sh) runs it non-root with --group-add set to
    # the host's real docker.sock GID.
    user: root
    restart: unless-stopped

networks:
  kuberfy-network:
    name: kuberfy-network
  # Deployed application containers live here instead — isolated from kuberfy's own network (see deploy.ts),
  # so a shell inside a deployed app can't reach kuberfy's dashboard/API or its Docker-socket access. Must be
  # overlay (deployed apps are Swarm services — Swarm refuses to attach a service to a plain bridge network) and
  # attachable (Traefik joins it too, but stays a plain compose container in dev, not a service).
  kuberfy-apps-network:
    name: kuberfy-apps-network
    driver: overlay
    attachable: true

volumes:
  traefik-certs:
  kuberfy-data:
