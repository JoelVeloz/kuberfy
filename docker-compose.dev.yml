# Dev stack: bind-mounts source + runs `bun run dev` with hot reload, so code changes
# don't require rebuilding the production Dockerfile (bun compile + astro build) each time.
# web and api are two independent hot-reloading origins here (unlike production, where one process serves both) —
# the panel calls the API cross-origin over CORS (see apps/api/src/index.ts + apps/web/src/lib/api-url.ts) instead
# of going through a proxy, since Vite's dev proxy (http-proxy) crashes under Bun on WebSocket teardown.
# traefik stays up on :80, matching production's "80 is exclusively traefik" rule, but nothing in this dev
# stack routes through it right now — it's here for parity/future use (see traefik/dev.yml).
# Usage: docker compose -f docker-compose.dev.yml up
services:
  traefik:
    image: traefik:v3.7
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
    volumes:
      - ./traefik/dev.yml:/etc/traefik/dynamic/dev.yml:ro
    mem_limit: 256m
    depends_on:
      - api
      - web

  api:
    image: oven/bun:1-alpine
    working_dir: /app
    volumes:
      - ./apps/api:/app
      - api-node-modules:/app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
    env_file: apps/api/.env
    ports:
      - "3001:3000"
    mem_limit: 256m
    command: sh -c "bun install && bun run dev"

  web:
    image: oven/bun:1-alpine
    working_dir: /app
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules
    environment:
      - PUBLIC_API_URL=http://localhost:3001
    ports:
      - "3000:4321"
    command: sh -c "bun install && bun run dev -- --host 0.0.0.0"
    depends_on:
      - api

volumes:
  api-node-modules:
  web-node-modules:
